{% load tz %}
{% load mathfilters %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIVAALA - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Nunito Sans'] }, colors: { primary:'#166534', accent:'#F59E0B', bg:'#F8FAFC' } } } }
</script>
<style>
.htmx-indicator { display: none; }
.htmx-request .htmx-indicator { display: inline-block; }
.htmx-request.htmx-indicator { display: inline-block; }
.htmx-request .submit-text { display: none; }
</style>
</head>
<body class="bg-bg font-sans text-slate-900" x-data="{ toast: '' }" @htmx:after-request="if($event.detail.successful) { toast = 'Success!' ; setTimeout(() => toast = '', 3000) }">
    <div x-show="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-primary text-white px-4 py-2 rounded-xl shadow-lg z-50 font-semibold" x-text="toast" style="display: none;"></div>

    <header class='bg-white border-b'>
        <nav class='max-w-md mx-auto h-16 px-4 flex items-center justify-between'>
            <h1 class='font-bold text-primary text-xl'>NIVAALA</h1>
            <a href="/login" class='w-11 h-11 rounded-full flex items-center justify-center bg-slate-100'>☺</a>
        </nav>
    </header>
    <main class='max-w-md mx-auto p-4 space-y-6 mb-20'>
        <h2 class='text-3xl font-bold'>Know what is in your food</h2>
        
        <form action="/search-results" method="GET" class='bg-white rounded-xl border p-4 space-y-4 relative'>
            <label for='search' class='block text-sm font-semibold'>Search</label>
            <input id='search' name='q' class='w-full border rounded-xl px-4 py-3' placeholder='Search dishes...'>
            
            <div class='flex flex-wrap gap-2'>
                <label class='cursor-pointer'>
                    <input type="checkbox" name="diet" value="vegetarian" class="hidden peer">
                    <span class='px-4 py-2 rounded-full border peer-checked:bg-primary peer-checked:text-white transition-colors'>Vegetarian</span>
                </label>
                <label class='cursor-pointer'>
                    <input type="checkbox" name="diet" value="vegan" class="hidden peer">
                    <span class='px-4 py-2 rounded-full border peer-checked:bg-primary peer-checked:text-white transition-colors'>Vegan</span>
                </label>
            </div>
            
            <button type="submit" class='w-full bg-primary text-white rounded-xl py-3 font-semibold disabled:opacity-70 disabled:cursor-not-allowed'>
                <span class="submit-text">Find Dishes</span>
            </button>
        </form>

        <section id='popular-dishes' hx-get="/api/v1/dishes/htmx?limit=3" hx-trigger="load">
            <h3 class="font-bold text-lg mb-3">Popular Dishes</h3>
            
            <!-- 1. LOADING STATE -->
            <div class="htmx-indicator space-y-4 w-full">
                <div class="bg-white rounded-xl border p-4 animate-pulse">
                    <div class="h-6 bg-slate-200 rounded w-1/3 mb-2"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/2 mb-4"></div>
                    <div class="h-5 bg-slate-200 rounded w-1/4"></div>
                </div>
            </div>

            <!-- GET /api/v1/dishes -->
            {% for dish in dishes %}
                <article class='bg-white rounded-xl border p-4 mb-4 flex justify-between items-center'>
                    <div>
                        <h4 class='font-bold text-lg'><a href="/dishes/{{ dish.id }}">{{ dish.name }}</a></h4>
                        <p class='text-sm text-slate-600'>₹{% widthratio dish.price 100 1 %}</p>
                    </div>
                    <button hx-post="/api/v1/me/favourites" 
                            hx-vals='{"dish_id": {{ dish.id }}}'
                            hx-swap="none"
                            class="text-slate-400 hover:text-primary transition-colors text-2xl">
                        ♥
                    </button>
                </article>
            {% empty %}
                <div class="text-center py-6 bg-slate-50 border border-dashed rounded-xl">
                    <p class="text-slate-500">No popular dishes right now.</p>
                </div>
            {% endfor %}
        </section>
        <div id="list-error" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mt-4 text-center">
            <p class="mb-2">Failed to load dishes.</p>
            <button onclick="htmx.trigger('#popular-dishes', 'load')" class="px-4 py-2 bg-red-600 text-white rounded-lg">Retry</button>
        </div>
    </main>

    <nav class='fixed bottom-0 left-0 right-0 bg-white border-t h-16 z-40'>
        <div class='max-w-md mx-auto grid grid-cols-2 h-full'>
            <a href="/" class='flex flex-col items-center justify-center text-primary font-semibold'>
                🏠<span class='text-xs'>Home</span>
            </a>
            <a href="/favourites" class='flex flex-col items-center justify-center text-slate-500'>
                ♥<span class='text-xs'>Favourites</span>
            </a>
        </div>
    </nav>
    <script>
        document.body.addEventListener('htmx:responseError', function(event) {
            if (event.detail.elt.id === 'popular-dishes') {
                document.getElementById('list-error').classList.remove('hidden');
                document.getElementById('popular-dishes').innerHTML = '';
            }
        });
    </script>
</body>
</html>
