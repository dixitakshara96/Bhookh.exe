{% load tz %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIVAALA - Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Nunito Sans'] }, colors: { primary:'#166534', accent:'#F59E0B', bg:'#F8FAFC' } } } }
</script>
<style>
.htmx-indicator { display: none; }
.htmx-request .htmx-indicator { display: inline-block; }
.htmx-request.htmx-indicator { display: inline-block; }
.htmx-request .submit-text { display: none; }
</style>
</head>
<body class="bg-bg font-sans text-slate-900" x-data="{ toast: '' }" @htmx:after-request="if($event.detail.successful) { toast = 'Success!' ; setTimeout(() => toast = '', 3000) }">
    <div x-show="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-primary text-white px-4 py-2 rounded-xl shadow-lg z-50 font-semibold" x-text="toast" style="display: none;"></div>

    <header class='bg-white border-b'>
        <nav class='max-w-md mx-auto h-16 px-4 flex items-center justify-between'>
            <button class='w-11 h-11' onclick="history.back()">←</button>
            <h1 class='font-bold'>Authentication</h1>
            <button class='w-11 h-11'>×</button>
        </nav>
    </header>
    <main class='max-w-md mx-auto p-4'>
        <form hx-post="/api/v1/auth/login" 
              hx-target="body" 
              hx-disabled-elt="find button" 
              class='bg-white rounded-xl border p-5 space-y-4 relative'>
            {% csrf_token %}
            
            <label for='email' class='block text-sm font-semibold'>Email</label>
            <input id='email' name='email' type='email' class='w-full border rounded-xl px-4 py-3' required>
            <p id="error-email" class="text-red-500 text-sm mt-1"></p>

            <label for='password' class='block text-sm font-semibold'>Password</label>
            <input id='password' name='password' type='password' class='w-full border rounded-xl px-4 py-3' required>
            <p id="error-password" class="text-red-500 text-sm mt-1"></p>
            
            <div id="form-error" class="text-red-600 font-semibold hidden"></div>

            <button type="submit" class='w-full bg-primary text-white rounded-xl py-3 font-semibold disabled:opacity-70 disabled:cursor-not-allowed'>
                <span class="submit-text">Continue</span>
                <svg class="animate-spin h-5 w-5 text-white mx-auto htmx-indicator" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </main>

    <script>
        document.body.addEventListener('htmx:responseError', function(event) {
            const status = event.detail.xhr.status;
            if (status === 400 || status === 401) {
                const response = JSON.parse(event.detail.xhr.responseText);
                if (response.error && response.error.fields) {
                    for (const [field, message] of Object.entries(response.error.fields)) {
                        const errorEl = document.getElementById(`error-${field}`);
                        if (errorEl) errorEl.innerText = message;
                    }
                } else if (response.error && response.error.message) {
                    const formError = document.getElementById('form-error');
                    formError.innerText = response.error.message;
                    formError.classList.remove('hidden');
                }
            }
        });
        document.querySelector('form').addEventListener('input', (e) => {
            const errorEl = document.getElementById(`error-${e.target.name}`);
            if (errorEl) errorEl.innerText = '';
            document.getElementById('form-error').classList.add('hidden');
        });
    </script>
</body>
</html>
