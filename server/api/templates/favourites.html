{% load tz %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NIVAALA - Saved Favourites</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { primary: "#059669", "primary-dark": "#047857", surface: "#f8fafc", "surface-dark": "#f1f5f9" }
                }
            }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }
    </style>
</head>
<body class="bg-surface text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-sm">
        <a href="/" class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">restaurant_menu</span>
            <span class="text-2xl font-extrabold tracking-tight text-slate-900 hidden sm:block">NIVAALA</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
            <a href="/" class="text-slate-500 hover:text-primary font-medium transition">Home</a>
            <a href="/favourites" class="text-primary font-bold transition">Favourites</a>
            <a href="/profile" class="text-slate-500 hover:text-primary font-medium transition">Profile</a>
        </div>
        <div class="flex items-center gap-4">
            <a href="/profile" class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm hover:shadow-md transition border border-slate-200">
                <span class="material-symbols-outlined text-slate-400">person</span>
                <span class="font-semibold text-sm">{{ request.user.name|default:"Guest" }}</span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-6 py-10">
        <div class="flex items-center gap-3 mb-8">
            <span class="material-symbols-outlined text-4xl text-red-500" style="font-variation-settings: 'FILL' 1;">favorite</span>
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 leading-tight">Your Saved Dishes</h1>
                <p class="text-slate-500 font-medium text-sm">Dishes you've marked as safe and delicious.</p>
            </div>
        </div>

        <div id="favourites-container" hx-get="/api/v1/me/favourites/htmx" hx-trigger="load">
            <!-- Loading Skeleton -->
            <div class="htmx-indicator grid grid-cols-1 md:grid-cols-2 gap-6 w-full animate-pulse">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex gap-4">
                    <div class="w-24 h-24 bg-slate-200 rounded-2xl shrink-0"></div>
                    <div class="flex-1 space-y-3 py-2">
                        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
                        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <aside class="md:hidden glass fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200">
        <div class="flex justify-around px-4 py-3">
            <a href="/" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">home</span>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="/search-results" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">search</span>
                <span class="text-[10px] font-bold">Search</span>
            </a>
            <a href="/favourites" class="flex flex-col items-center text-primary">
                <span class="material-symbols-outlined text-2xl">favorite</span>
                <span class="text-[10px] font-bold">Saved</span>
            </a>
            <a href="/profile" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">person</span>
                <span class="text-[10px] font-bold">Profile</span>
            </a>
        </div>
    </aside>

    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            if(evt.detail.xhr.status === 401) window.location.href = '/login';
        });
    </script>
</body>
</html>
