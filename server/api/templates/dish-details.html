{% load tz %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NIVAALA - Dish Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { 
                        primary: "#16A34A", 
                        "primary-dark": "#15803D", 
                        accent: "#F59E0B",
                        "accent-dark": "#D97706",
                        surface: "#F8FAF8", 
                        "surface-dark": "#e2e8f0" 
                    },
                    borderRadius: {
                        'xl': '24px',
                        '2xl': '24px',
                        '3xl': '24px',
                        '4xl': '24px'
                    },
                    boxShadow: {
                        'sm': '0 2px 8px rgba(22, 163, 74, 0.04)',
                        'md': '0 4px 16px rgba(22, 163, 74, 0.08)',
                        'lg': '0 10px 24px rgba(22, 163, 74, 0.12)',
                        'xl': '0 20px 40px rgba(22, 163, 74, 0.16)',
                        '2xl': '0 25px 50px rgba(22, 163, 74, 0.20)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }
    </style>
</head>
<body class="bg-surface text-slate-800 font-sans antialiased min-h-screen">
    
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 h-[72px] flex items-center justify-between shadow-sm">
        <a href="/" class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">restaurant_menu</span>
            <span class="text-2xl font-extrabold tracking-tight text-slate-900 mt-1">NIVAALA</span>
        </a>
        <div class="flex items-center gap-6 hidden md:flex">
            <a href="/" class="text-sm font-bold text-slate-600 hover:text-primary transition-colors">Home</a>
            <a href="/search-results" class="text-sm font-bold text-slate-600 hover:text-primary transition-colors">Search</a>
            <a href="/favourites" class="text-sm font-bold text-slate-600 hover:text-primary transition-colors">Saved</a>
            {% if request.user.is_authenticated %}
            <a href="/profile" class="text-sm font-bold text-slate-500 hover:text-primary transition-colors ml-4 border-l border-slate-300 pl-4 flex items-center gap-1">
                <span class="material-symbols-outlined text-[20px]">account_circle</span>
                Profile
            </a>
            {% else %}
            <a href="/login" class="text-sm font-bold text-slate-500 hover:text-primary transition-colors ml-4 border-l border-slate-300 pl-4">Sign In</a>
            {% endif %}
        </div>
    </nav>

    <!-- Container loaded via HTMX -->
    <div id="dish-details-container" class="max-w-4xl mx-auto bg-white min-h-screen shadow-2xl relative pb-32" hx-get="/api/v1/dishes/{{ dish_id|default:'101' }}/htmx" hx-trigger="load">
        
        <!-- Loading Skeleton -->
        <div class="htmx-indicator flex flex-col w-full animate-pulse">
            <div class="h-[400px] bg-slate-200 w-full"></div>
            <div class="p-8 space-y-6">
                <div class="h-10 bg-slate-200 rounded w-1/2"></div>
                <div class="h-6 bg-slate-200 rounded w-1/3"></div>
                <div class="h-32 bg-slate-200 rounded-2xl w-full mt-8"></div>
                <div class="h-32 bg-slate-200 rounded-2xl w-full mt-4"></div>
            </div>
        </div>

    </div>

    <!-- Mobile Bottom Nav -->
    <aside class="md:hidden glass fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200 pb-safe">
        <div class="flex justify-around px-4 py-3">
            <a href="/" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">home</span>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="/search-results" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">search</span>
                <span class="text-[10px] font-bold">Search</span>
            </a>
            <a href="/favourites" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">favorite</span>
                <span class="text-[10px] font-bold">Saved</span>
            </a>
            <a href="/profile" class="flex flex-col items-center text-slate-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-2xl">person</span>
                <span class="text-[10px] font-bold">Profile</span>
            </a>
        </div>
    </aside>

    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            if(evt.detail.xhr.status === 401) {
                let dish_id = "{{ dish_id|default:'101' }}";
                window.location.href = '/login?next=/dishes/' + dish_id + '&action=save';
            }
        });
    </script>
</body>
</html>
