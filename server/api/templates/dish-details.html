{% load tz %}
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NIVAALA - Dish Details</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..900;1,6..12,300..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://unpkg.com/htmx.org@1.9.6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-container": "#fea619", "on-primary-fixed-variant": "#005226", "on-tertiary-fixed": "#00210a", "surface-container-low": "#f2f3ff", "secondary-fixed-dim": "#ffb95f", "on-surface-variant": "#404940", "primary": "#004c22", "on-secondary-fixed": "#2a1700", "surface": "#faf8ff", "on-tertiary-container": "#81e394", "surface-variant": "#dae2fd", "on-secondary-fixed-variant": "#653e00", "tertiary": "#004b1f", "error": "#ba1a1a", "on-secondary": "#ffffff", "secondary": "#855300", "inverse-surface": "#283044", "tertiary-container": "#00662d", "tertiary-fixed": "#95f8a7", "surface-container": "#eaedff", "background": "#faf8ff", "inverse-primary": "#8bd79b", "on-tertiary": "#ffffff", "on-background": "#131b2e", "outline": "#707a6f", "surface-container-lowest": "#ffffff", "on-tertiary-fixed-variant": "#005323", "error-container": "#ffdad6", "on-secondary-container": "#684000", "secondary-fixed": "#ffddb8", "on-primary-fixed": "#00210b", "inverse-on-surface": "#eef0ff", "on-primary-container": "#93e0a2", "on-error": "#ffffff", "tertiary-fixed-dim": "#79db8d", "on-surface": "#131b2e", "surface-dim": "#d2d9f4", "surface-tint": "#1f6c3a", "surface-container-high": "#e2e7ff", "primary-container": "#166534", "surface-bright": "#faf8ff", "primary-fixed": "#a6f4b5", "surface-container-highest": "#dae2fd", "on-error-container": "#93000a", "outline-variant": "#bfc9bd", "on-primary": "#ffffff", "primary-fixed-dim": "#8bd79b" } } }
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: flex; }
    .htmx-request.htmx-indicator { display: flex; }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen flex justify-center">
<main class="w-full max-w-md bg-surface-container-lowest min-h-screen flex flex-col relative pb-32 shadow-xl border-x border-outline-variant/30">
    
    <!-- Floating Top Nav -->
    <header class="absolute top-0 w-full z-40 px-4 pt-4 flex items-center justify-between">
        <button type="button" onclick="window.location.href='/search-results'" class="p-2 bg-surface-container-lowest/80 backdrop-blur rounded-full text-on-surface shadow-sm hover:bg-surface-container">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
        </button>
        <div class="flex items-center gap-2">
            <button class="p-2 bg-primary-container text-white rounded-full shadow-sm hover:bg-primary transition-colors">
                <span class="material-symbols-outlined text-lg">person</span>
            </button>
        </div>
    </header>

    <div id="dish-details-container" hx-get="/api/v1/dishes/{{ dish_id|default:'101' }}/htmx" hx-trigger="load">
        <!-- Loading Skeleton -->
        <div class="htmx-indicator flex flex-col w-full">
            <div class="h-[250px] bg-surface-container-low animate-pulse w-full"></div>
            <div class="px-4 py-4 space-y-4">
                <div class="h-6 bg-outline-variant/30 rounded w-1/2"></div>
                <div class="h-4 bg-outline-variant/30 rounded w-3/4"></div>
                <div class="h-20 bg-outline-variant/30 rounded w-full"></div>
            </div>
        </div>
    </div>

    <!-- Sticky Bottom Nav -->
    <aside class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-surface-container-lowest/95 backdrop-blur-md border-t border-outline-variant/30 p-4">
        <div class="flex items-center gap-3">
            <button hx-post="/api/v1/me/favourites" hx-vals='{"dish_id": {{ dish_id|default:"101" }}}' hx-swap="none" 
                    x-data="{ isFaved: false }" @click="isFaved = !isFaved" 
                    :class="isFaved ? 'bg-error/10 text-error border-error/20' : 'bg-surface-container-lowest text-on-surface border-outline-variant/30'"
                    class="w-full p-3.5 rounded-xl border flex items-center justify-center gap-2 font-bold text-sm shadow-md transition-all active:scale-[0.99]">
                <span class="material-symbols-outlined text-xl" :style="isFaved ? 'font-variation-settings: \'FILL\' 1;' : ''" x-text="isFaved ? 'favorite' : 'favorite_border'">favorite_border</span>
                Save to Favourites
            </button>
        </div>
        <p class="text-center text-[9px] text-on-surface-variant font-medium mt-2 flex items-center justify-center gap-1">
            <span class="material-symbols-outlined text-[10px]">verified</span>
            Safety parameters checked and verified.
        </p>
    </aside>

</main>
<script>
    document.body.addEventListener('htmx:responseError', function(evt) {
        if(evt.detail.xhr.status === 401) {
            let dish_id = "{{ dish_id|default:'101' }}";
            window.location.href = '/login?next=/dishes/' + dish_id + '&action=save';
        }
    });
</script>
</body>
</html>
